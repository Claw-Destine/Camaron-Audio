- name: kokoro-82m-v1.0
  task: tts
  hf_repo: onnx-community/Kokoro-82M-v1.0-ONNX
  description: "Kokoro 82M v1.0 — multilingual TTS (en/es/fr/hi/it/ja/pt/zh), one voice per language shown"
  sample_rate: 24000
  voices:
    - af_heart
    - af_sarah
    - af_nicole
    - am_michael
    - bf_emma
    - bm_george
    - ef_dora
    - ff_siwis
    - hf_alpha
    - if_sara
    - pf_dora
    - zf_xiaobei
    - jf_alpha
  voice_map:
    alloy: af_heart
    nova: af_nicole
    fable: af_sarah
    echo: am_michael
    onyx: bf_emma
    shimo: bm_george
  # voice id -> phonemizer language; "en" voices fall back to the default
  voice_language:
    ef_dora: es
    ff_siwis: fr
    hf_alpha: hi
    if_sara: it
    pf_dora: pt
    zf_xiaobei: zh
    jf_alpha: ja
  default_voice: af_heart
  voice_repo: hexgrad/Kokoro-82M
  download_files:
    - onnx/model.onnx
    - tokenizer.json
    - config.json
  onnx_files:
    - onnx/model.onnx
  params:
    temperature: {default: 0.0, min: 0.0, max: 1.0}
    top_p: {default: 1.0, min: 0.0, max: 1.0}
  metadata:
    license: Apache-2.0
